# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', full-tests: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      COGRAPH_COVERAGE_TESTS: ${{ matrix.config.full-tests && 'true' || '' }}

    steps:
      - uses: actions/checkout@v4
      - name: Install XQuartz (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Proof that the centrality surface runs without igraph: install only the
  # hard dependencies, remove igraph, and run the centrality test files.
  # Tests that use igraph as an oracle skip; every computation must run.
  centrality-without-igraph:
    runs-on: ubuntu-latest
    name: centrality without igraph
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::digest
          dependencies: '"hard"'
      - name: Ensure igraph is absent, then run the centrality tests
        run: |
          Rscript -e 'if (requireNamespace("igraph", quietly = TRUE)) remove.packages("igraph")'
          Rscript -e 'stopifnot(!requireNamespace("igraph", quietly = TRUE))'
          R CMD INSTALL --no-docs .
          Rscript -e '
            library(testthat); library(cograph)
            files <- list.files("tests/testthat", pattern = "^test-(centrality|kernels|port|networks|equiv-standalone)", full.names = TRUE)
            res <- do.call(rbind, lapply(files, function(f) { r <- as.data.frame(test_file(f, reporter = "summary", package = "cograph")); data.frame(file = basename(f), n = sum(r$nb), failed = sum(r$failed), errors = sum(r$error), skipped = sum(r$skipped)) }))
            print(res, row.names = FALSE)
            stopifnot(sum(res$failed) + sum(res$errors) == 0)'
