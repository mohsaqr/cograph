# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', full-tests: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      COGRAPH_COVERAGE_TESTS: ${{ matrix.config.full-tests && 'true' || '' }}

    steps:
      - uses: actions/checkout@v4
      - name: Install XQuartz (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Proof that native computations and the CRAN regressions run without igraph:
  # install only the hard dependencies, remove igraph, and run the test files.
  # Tests that use igraph as an oracle skip; every computation must run.
  centrality-without-igraph:
    runs-on: ubuntu-latest
    name: centrality without igraph
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::digest
          dependencies: '"hard"'
      - name: Ensure igraph is absent, then run the centrality tests
        run: |
          Rscript -e 'if (requireNamespace("igraph", quietly = TRUE)) remove.packages("igraph")'
          Rscript -e 'stopifnot(!requireNamespace("igraph", quietly = TRUE))'
          R CMD INSTALL --no-docs .
          Rscript -e '
            library(testthat); library(cograph)
            files <- list.files(c("tests/testthat", "tests/equivalence"), pattern = "^test-(centrality|kernels|port|networks|equiv-standalone)", full.names = TRUE)
            res <- do.call(rbind, lapply(files, function(f) { r <- as.data.frame(test_file(f, reporter = "summary", package = "cograph")); data.frame(file = basename(f), n = sum(r$nb), failed = sum(r$failed), errors = sum(r$error), skipped = sum(r$skipped)) }))
            print(res, row.names = FALSE)
            stopifnot(sum(res$failed) + sum(res$errors) == 0)'
      - name: Check CRAN regressions and community examples without igraph
        run: |
          Rscript -e '
            stopifnot(!requireNamespace("igraph", quietly = TRUE))
            library(testthat); library(cograph)
            test_dir("tests/testthat", filter = "^(audit-fixes|layout-target-saqr|motifs-as-data-frame|motifs-triad-patterns|wrangling-invariants)$", package = "cograph")
            code <- tempfile(fileext = ".R")
            tools::Rd2ex("man/overlay_communities.Rd", out = code)
            pdf(tempfile(fileext = ".pdf"))
            sys.source(code, envir = new.env(parent = globalenv()))
            dev.off()'

  # Equivalence tests (cograph against igraph, sna, centiserve, NetworkX and
  # the golden corpus) live in tests/equivalence, outside R CMD check, so the
  # CRAN check stays within its time budget. They run here on every push.
  equivalence:
    runs-on: ubuntu-latest
    name: equivalence tests
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      COGRAPH_COVERAGE_TESTS: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::digest
      - name: Run tests/equivalence
        run: |
          R CMD INSTALL --no-docs .
          Rscript -e '
            library(testthat); library(cograph)
            r <- as.data.frame(test_dir("tests/equivalence", reporter = "summary", package = "cograph", stop_on_failure = FALSE))
            cat("passed", sum(r$passed), "failed", sum(r$failed), "errors", sum(r$error), "skipped", sum(r$skipped), "\n")
            stopifnot(sum(r$failed) + sum(r$error) == 0)'
